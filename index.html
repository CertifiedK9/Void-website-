<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>⚫ VOID PLATFORM</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --v:#08000f;--dp:#140025;--mid:#4c0099;--br:#7c3aed;--lt:#c084fc;--gl:#a855f7;
  --txt:#e8d5ff;--mut:#9ca3af;--bdr:rgba(124,58,237,.32);--gs:rgba(15,0,30,.88);--g2:rgba(124,58,237,.1)
}
html,body{height:100%;font-family:'Rajdhani',sans-serif;color:var(--txt);background:var(--v);overflow-x:hidden}
body{background-size:cover;background-position:center;background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(to bottom,rgba(8,0,15,.85),rgba(8,0,15,.72) 50%,rgba(8,0,15,.92));z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--v)}
::-webkit-scrollbar-thumb{background:var(--mid);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.fu{animation:fadeUp .38s ease both}
/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;height:54px;background:rgba(8,0,15,.97);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:500;backdrop-filter:blur(16px)}
.logo-img{width:34px;height:34px;border-radius:7px;object-fit:cover;border:2px solid var(--br)}
.logo-txt{font-family:'Cinzel',serif;font-size:15px;font-weight:900;background:linear-gradient(90deg,var(--lt),var(--br));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.18em}
.spacer{flex:1}
.tbb{background:var(--g2);border:1px solid var(--bdr);border-radius:18px;padding:4px 9px;font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ndot{position:absolute;top:1px;right:1px;width:7px;height:7px;background:#ef4444;border-radius:50%;animation:pulse 1.5s infinite}
/* SIDEBAR */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:498}
#overlay.on{display:block}
#sidebar{position:fixed;left:-268px;top:0;bottom:0;width:263px;background:rgba(6,0,15,.98);border-right:1px solid var(--bdr);z-index:499;transition:left .28s ease;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:24px}
#sidebar.on{left:0}
.nav{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--mut);font-size:13px;font-weight:600;transition:all .18s;margin:1px 7px;border:1px solid transparent}
.nav:hover,.nav.on{color:var(--lt);background:rgba(124,58,237,.16);border-color:rgba(124,58,237,.28)}
.nav-i{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-d{height:1px;background:var(--bdr);margin:6px 14px}
/* MAIN */
#main{padding:62px 0 60px;min-height:100vh}
.page{padding:14px;max-width:920px;margin:0 auto}
/* PANELS */
.panel{background:var(--gs);border:1px solid var(--bdr);border-radius:13px;padding:18px;backdrop-filter:blur(16px)}
.ptitle{font-family:'Cinzel',serif;font-size:17px;color:var(--lt);letter-spacing:.14em;margin-bottom:13px}
.sc{background:var(--g2);border:1px solid var(--bdr);border-radius:11px;padding:14px;text-align:center}
.sv{font-size:24px;font-weight:900;font-family:'Cinzel',serif;color:var(--lt)}
.sl{font-size:10px;color:var(--mut);letter-spacing:.14em;margin-top:2px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:linear-gradient(135deg,var(--br),var(--mid));border:none;color:#fff;padding:10px 18px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.11em;border-radius:7px;cursor:pointer;transition:all .22s;font-weight:700;white-space:nowrap;box-shadow:0 0 16px rgba(124,58,237,.3)}
.btn:hover{box-shadow:0 0 28px rgba(168,85,247,.55);transform:translateY(-1px)}
.bg{background:transparent;border:1px solid var(--bdr);color:var(--lt);box-shadow:none}
.bg:hover{background:var(--g2);box-shadow:0 0 14px rgba(124,58,237,.2)}
.br2{background:linear-gradient(135deg,#dc2626,#991b1b)}
.bsuc{background:linear-gradient(135deg,#16a34a,#15803d)}
.bsm{padding:5px 11px;font-size:11px}
/* INPUTS */
input,textarea,select{font-family:'Rajdhani',sans-serif;background:rgba(124,58,237,.09);border:1px solid var(--bdr);border-radius:7px;color:var(--txt);padding:9px 12px;font-size:14px;outline:none;width:100%;transition:border .18s}
input:focus,textarea:focus{border-color:var(--br);box-shadow:0 0 10px rgba(124,58,237,.25)}
select option{background:#140025}
.lbl{font-size:11px;color:var(--lt);letter-spacing:.14em;display:block;margin-bottom:5px;font-family:'Cinzel',serif}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.ga{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
/* GAME/AUCTION CARDS */
.gc{background:var(--g2);border:1px solid var(--bdr);border-radius:11px;padding:16px;cursor:pointer;transition:all .22s}
.gc:hover{background:rgba(124,58,237,.2);transform:translateY(-4px);box-shadow:0 10px 28px rgba(124,58,237,.22)}
.ac{background:var(--g2);border:1px solid var(--bdr);border-radius:11px;overflow:hidden;cursor:pointer;transition:all .22s;position:relative}
.ac:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(124,58,237,.28)}
/* LEADERBOARD */
.lbr{display:grid;grid-template-columns:38px 40px 1fr 1fr 88px;gap:6px;align-items:center;padding:9px 13px;border-bottom:1px solid rgba(124,58,237,.08);cursor:pointer}
.lbr:hover{background:rgba(124,58,237,.07)}
/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:600;display:flex;align-items:center;justify-content:center;padding:14px}
.mo{width:100%;max-width:460px;max-height:92vh;display:flex;flex-direction:column}
/* DM */
.dmw{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:10px;min-height:180px;max-height:320px}
.dmb{padding:8px 11px;border-radius:9px;max-width:78%;font-size:13px;word-break:break-word}
.dmb.me{background:rgba(124,58,237,.32);align-self:flex-end;border-radius:9px 9px 0 9px}
.dmb.th{background:rgba(25,0,50,.75);align-self:flex-start;border-radius:9px 9px 9px 0}
/* MUSIC PLAYER */
#mp{position:fixed;bottom:0;left:0;right:0;height:52px;background:rgba(6,0,15,.97);border-top:1px solid var(--bdr);display:none;align-items:center;gap:9px;padding:0 12px;z-index:500}
.trk{font-size:11px;color:var(--lt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpb{background:none;border:none;color:var(--lt);font-size:17px;cursor:pointer;padding:3px}
.mpbar{flex:1;height:3px;background:rgba(124,58,237,.22);border-radius:2px;cursor:pointer;max-width:110px}
.mpfill{height:100%;background:var(--br);border-radius:2px;transition:width .5s}
/* BROADCAST */
#bcbar{position:fixed;top:0;left:0;right:0;z-index:999;background:linear-gradient(90deg,#4c0099,#7c3aed,#4c0099);padding:10px 14px;display:none;align-items:center;gap:9px;animation:slideDown .4s ease}
#bcbar.on{display:flex}
/* PROFILE */
.pb{height:100px;overflow:hidden;background:var(--dp)}
.pp{width:66px;height:66px;border-radius:50%;border:3px solid var(--br);overflow:hidden;background:var(--mid);margin:-33px 0 0 14px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:28px}
/* RARITY */
.rM{border-color:rgba(255,60,60,.5)!important}
.rL{border-color:rgba(255,215,0,.45)!important}
.rE{border-color:rgba(168,85,247,.5)!important}
.rR{border-color:rgba(59,130,246,.5)!important}
.rU{border-color:rgba(74,222,128,.4)!important}
.rC{border-color:rgba(156,163,175,.3)!important}
/* ACCOUNT PILLS */
.apill{display:flex;align-items:center;gap:5px;background:var(--g2);border:1px solid var(--bdr);border-radius:16px;padding:3px 9px;cursor:pointer;font-size:11px;transition:all .18s}
.apill.on{border-color:var(--br);color:var(--lt)}
/* TRANSFER */
.tlist{max-height:200px;overflow-y:auto;border:1px solid var(--bdr);border-radius:7px;margin-bottom:9px}
.ti{padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;transition:background .15s}
.ti:hover{background:rgba(124,58,237,.13)}
.ti.sel{background:rgba(124,58,237,.22);color:var(--lt)}
/* SUPPORT */
.supcard{background:var(--g2);border:1px solid var(--bdr);border-radius:11px;padding:14px;display:flex;align-items:center;gap:13px}
/* STARS */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
/* MOBILE */
@media(max-width:620px){
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:repeat(2,1fr)}
  .lbr{grid-template-columns:34px 34px 1fr 78px}
  .lbrnk{display:none}
  .panel{padding:13px}
  .tbh{display:none}
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="bcbar">
  <span style="font-size:15px">📢</span>
  <div id="bcc" style="flex:1;font-size:13px;overflow:hidden"></div>
  <div id="bcmd"></div>
  <button onclick="document.getElementById('bcbar').classList.remove('on')" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0">×</button>
</div>
<div id="app">
<div id="topbar">
  <button onclick="toggleSB()" style="background:none;border:none;color:var(--lt);font-size:21px;cursor:pointer;padding:4px;flex-shrink:0">☰</button>
  <img id="logo-img" class="logo-img" alt="V"/>
  <span class="logo-txt" id="logo-txt">VOID</span>
  <div class="spacer"></div>
  <div class="tbb tbh" id="tb-stats" style="gap:8px;font-size:11px">
    <span>👥<span id="tb-u">0</span></span>
    <span>🟢<span id="tb-o">0</span></span>
    <span>🃏<span id="tb-c">0</span></span>
  </div>
  <div class="tbb" id="tb-vc" style="display:none;font-size:12px">💰<span id="vc-d">0</span> VC</div>
  <div style="position:relative;display:none" id="nb-wrap">
    <button class="btn bg bsm" onclick="navigate('voidmail')" style="border-radius:16px;padding:5px 11px;font-size:13px">🔔<span id="nc">0</span></button>
    <div class="ndot" id="ndot" style="display:none"></div>
  </div>
</div>
<div id="overlay" onclick="toggleSB()"></div>
<div id="sidebar">
  <div style="padding:66px 14px 12px" id="sb-user"></div>
  <div id="sb-accs" style="padding:0 9px 7px"></div>
  <div class="nav-d"></div>
  <div id="sb-nav"></div>
  <div class="nav-d"></div>
  <div id="sb-bot"></div>
</div>
<div id="main"><div id="pc"></div></div>
<div id="mp">
  <button class="mpb" id="mp-prev">⏮</button>
  <button class="mpb" id="mp-play">▶️</button>
  <button class="mpb" id="mp-next">⏭</button>
  <div style="flex:1;min-width:0">
    <div class="trk" id="mp-name">No track</div>
    <div class="mpbar" onclick="seekAud(event)"><div class="mpfill" id="mp-prog" style="width:0%"></div></div>
  </div>
  <button class="mpb" id="mp-vol" onclick="toggleMute()">🔊</button>
  <label style="cursor:pointer;color:var(--lt);font-size:16px">➕<input type="file" accept="audio/*" multiple style="display:none" onchange="addMusic(this)"/></label>
</div>
<audio id="aud"></audio>
</div>

// Use named cards as base; generate rest procedurally for 23k total
function buildDB(){
  const db=[...NAMED_CARDS];
  let nId=NAMED_CARDS.length+1;
  // Generate cards to reach 23000+
  const target=23000;
  const perAnime=Math.ceil((target-db.length)/ANIME_TITLES.length);
  for(let ai=0;ai<ANIME_TITLES.length&&db.length<target;ai++){
    const an=ANIME_TITLES[ai];
    const count=Math.min(perAnime,target-db.length);
    for(let ci=0;ci<count&&db.length<target;ci++){
      const ri=Math.min(5,Math.floor(Math.pow(Math.random(),1.8)*6));
      const ra=RARITY_LIST[ri];
      const pw=ri===5?9400+Math.floor(Math.random()*600):
                ri===4?8500+Math.floor(Math.random()*900):
                ri===3?7000+Math.floor(Math.random()*1500):
                ri===2?5000+Math.floor(Math.random()*2000):
                ri===1?3000+Math.floor(Math.random()*2000):
                1000+Math.floor(Math.random()*2000);
      const ch=CHAR_TITLES[(ci*7+ai*3)%CHAR_TITLES.length];
      // Use a placeholder image based on rarity color (CSS gradient, no emoji)
      db.push({
        id:nId++,
        name:`${ch} of ${an}`,
        anime:an,
        s:Math.floor(ci/4)+1,
        type:["Series","OVA","Movie","Special"][ci%4],
        rarity:ra,
        power:pw,
        desc:`A ${ra.toLowerCase()} card from ${an}. Power level ${pw}.`,
        img:null, // generated cards use CSS gradient placeholder
        yr:1990+Math.floor(Math.random()*35)
      });
    }
  }
  return db;
}

function renderBJ(){return`${BB}<div class="panel" style="max-width:500px"><div class="ptitle">🂡 SHADOW BLACKJACK</div>${BJ.phase!=="bet"?`<div style="margin-bottom:13px"><div style="font-size:11px;color:var(--mut);margin-bottom:5px">DEALER ${BJ.phase==="done"?`(${hV(BJ.d)})`:"(?)"}</div><div style="display:flex;gap:5px;flex-wrap:wrap">${BJ.d.map((c,i)=>i===1&&BJ.phase!=="done"?`<span style="background:rgba(124,58,237,.18);border:1px solid var(--bdr);border-radius:5px;padding:3px 9px;font-size:13px">🂠</span>`:cH(c)).join("")}</div></div><div style="margin-bottom:13px"><div style="font-size:11px;color:var(--mut);margin-bottom:5px">YOU (${hV(BJ.p)})</div><div style="display:flex;gap:5px;flex-wrap:wrap">${BJ.p.map(cH).join("")}</div></div>`:""}${`<div id="bj-msg" style="text-align:center;min-height:20px;margin-bottom:11px;font-size:13px"></div>`}${BJ.phase==="bet"?`<div style="display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap">${[100,500,1000,5000].map(v=>`<button class="btn bg bsm" onclick="BJ.bet=${v};$('bj-deal').textContent='🂡 DEAL (${fB(v)} VC)'">${fB(v)}</button>`).join("")}</div><button class="btn" style="width:100%" id="bj-deal" onclick="bjDeal()">🂡 DEAL (${fB(BJ.bet)} VC)</button>`:""}${BJ.phase==="playing"?`<div style="display:flex;gap:9px"><button class="btn" style="flex:1" onclick="bjHit()">HIT</button><button class="btn br2" style="flex:1" onclick="bjStand()">STAND</button></div>`:""}${BJ.phase==="done"?`<button class="btn" style="width:100%" onclick="BJ.phase='bet';render()">PLAY AGAIN</button>`:""}</div>`}
function bjDeal(){if(!CU||(CU.coins||0)<BJ.bet)return;addVC(-BJ.bet);BJ.p=[drw(),drw()];BJ.d=[drw(),drw()];BJ.phase="playing";render();if(hV(BJ.p)===21)bjEnd(true)}
function bjHit(){BJ.p.push(drw());render();if(hV(BJ.p)>21)bjEnd(false)}
function bjStand(){bjEnd(false)}
function bjEnd(bj){while(!bj&&hV(BJ.d)<17)BJ.d.push(drw());BJ.phase="done";render();const pv=hV(BJ.p),dv=hV(BJ.d),msg=$("bj-msg");let win=0;if(pv>21){if(msg){msg.style.color="#f87171";msg.textContent="BUST! The void wins."}}else if(bj){win=Math.floor(BJ.bet*2.5);if(msg){msg.style.color="#ffd700";msg.textContent=`♠ BLACKJACK! +${fB(win)} VC`};addEXP(80)}else if(dv>21||pv>dv){win=BJ.bet*2;if(msg){msg.style.color="#4ade80";msg.textContent=`🎉 You win! +${fB(win)} VC`};addEXP(40)}else if(pv===dv){win=BJ.bet;if(msg){msg.style.color="var(--mut)";msg.textContent="Push — bet returned."};addEXP(10)}else{if(msg){msg.style.color="#f87171";msg.textContent="Dealer wins."}addEXP(5)}if(win)addVC(win)}

let CR={phase:"idle",mult:1,bet:500,iv:null};

function crStart(){if(CR.phase==="running")return;if(!CU||(CU.coins||0)<CR.bet)return;addVC(-CR.bet);CR.phase="running";CR.mult=1;const ca=Math.random()<.4?1+Math.random():2+Math.random()*8;const cb=$("cr-c"),sb=$("cr-s");if(cb){cb.disabled=false;cb.style.opacity="1"}if(sb)sb.disabled=true;CR.iv=setInterval(()=>{CR.mult=parseFloat((CR.mult*1.02).toFixed(2));const md=$("cr-m");if(md)md.textContent=CR.mult.toFixed(2)+"x";if(CR.mult>=ca){clearInterval(CR.iv);CR.phase="crashed";if(md){md.style.color="#ef4444";md.style.textShadow="0 0 18px #ef4444";md.textContent=parseFloat(ca.toFixed(2))+"x"}const msg=$("cr-msg");if(msg)msg.textContent=`💥 CRASHED at ${ca.toFixed(2)}x!`;if(cb){cb.disabled=true;cb.style.opacity=".5"}if(sb){sb.disabled=false;sb.textContent=`START (${fB(CR.bet)} VC)`}addEXP(5)}},100)}
function crCash(){if(CR.phase!=="running")return;clearInterval(CR.iv);CR.phase="idle";const win=Math.floor(CR.bet*CR.mult);addVC(win);addEXP(20);const msg=$("cr-msg");if(msg)msg.textContent=`✅ Cashed out! +${fB(win)} VC`;const cb=$("cr-c"),sb=$("cr-s");if(cb){cb.disabled=true;cb.style.opacity=".5"}if(sb)sb.disabled=false}

function getTimeLeft(et){const d=et-Date.now();if(d<=0)return"ENDED";const h=Math.floor(d/3.6e6),m=Math.floor((d%3.6e6)/6e4);return`${h}h ${m}m`}
function showCardModal(id){const a=AUCS.find(x=>x.id===id);if(!a)return;const col=RCOL[a.card.rarity]||"#9ca3af";const el=$("cm-area");if(!el)return;el.innerHTML=`<div class="mbg" id="cm-bg" onclick="if(event.target.id==='cm-bg')$('cm-bg').remove()"><div class="panel mo" style="max-width:440px"><div style="width:100%;height:185px;border-radius:9px;overflow:hidden;margin-bottom:11px;background:rgba(124,58,237,.08)">${cardImg(a.card)}</div><h3 style="text-align:center;color:${col};font-family:'Cinzel',serif;font-size:17px;margin-bottom:3px">${a.card.name}</h3><div style="text-align:center;font-size:11px;color:var(--mut);margin-bottom:3px">${a.card.anime} • ${a.card.type} • S${a.card.s} • ${a.card.yr||""}</div><div style="text-align:center;font-size:12px;color:var(--lt);margin-bottom:11px">${a.card.desc}</div><div style="display:flex;gap:11px;justify-content:center;margin-bottom:13px;flex-wrap:wrap"><div style="text-align:center"><div style="font-size:10px;color:var(--mut)">POWER</div><div style="color:#ffd700;font-weight:700">${a.card.power}</div></div><div style="text-align:center"><div style="font-size:10px;color:var(--mut)">TOP BID</div><div style="color:#4ade80;font-weight:700">${fB(a.topBid)} VC</div></div><div style="text-align:center"><div style="font-size:10px;color:var(--mut)">TIME LEFT</div><div style="color:#f59e0b;font-weight:700">${getTimeLeft(a.endTime)}</div></div><div style="text-align:center"><div style="font-size:10px;color:var(--mut)">MIN PRICE</div><div style="color:${col};font-weight:700">${fB(RMIN[a.card.rarity]||4000)} VC</div></div></div>${a.topBidder?`<div style="text-align:center;font-size:12px;color:var(--mut);margin-bottom:9px">Leading: <span style="color:var(--lt)">${a.topBidder}</span></div>`:""}<div style="display:flex;gap:7px;margin-bottom:9px"><input id="bid-i" type="number" placeholder="Min: ${a.topBid+1} VC" style="flex:1"/><button class="btn bsm" onclick="placeBid(${a.id})">BID</button></div><div id="bid-msg" style="font-size:11px;text-align:center;min-height:16px;color:#f87171;margin-bottom:7px"></div><div style="max-height:90px;overflow-y:auto;margin-bottom:9px">${(a.bids||[]).slice(-5).reverse().map(b=>`<div style="font-size:11px;color:var(--mut);padding:3px 0;border-bottom:1px solid var(--bdr)">${b.user} — ${fB(b.amount)} VC</div>`).join("")}</div><button class="btn bg bsm" onclick="$('cm-bg').remove()" style="width:100%">Close</button></div></div>`}
function placeBid(aId){const a=AUCS.find(x=>x.id===aId);if(!a||!CU)return;const inp=$("bid-i"),msg=$("bid-msg");const amt=parseInt(inp?.value||0),mp=RMIN[a.card.rarity]||4000;if(amt<mp){if(msg)msg.textContent=`Min bid for ${a.card.rarity}: ${fB(mp)} VC`;return}if(amt<=a.topBid){if(msg)msg.textContent=`Must exceed top bid: ${fB(a.topBid)} VC`;return}if((CU.coins||0)<amt){if(msg)msg.textContent="Insufficient Void Coins!";return}addVC(-amt);const idx=AUCS.findIndex(x=>x.id===aId);AUCS[idx]={...a,topBid:amt,topBidder:CU.username,bids:[...(a.bids||[]),{user:CU.username,amount:amt,time:Date.now()}]};LS.s("void_aucs",AUCS);addEXP(20);addVM(CU.username,`📊 You are top bidder on ${a.card.name} at ${fB(amt)} VC`);
  // If auction is winning, add card to inventory (preview)
  if(!CU.cards)CU.cards=[];
  const alreadyHas=CU.cards.find(c=>c.id===a.card.id);
  if(!alreadyHas){CU.cards=[...CU.cards,{...a.card,wonAt:Date.now(),paidVC:amt}];}
  USERS=USERS.map(u=>u.username===CU.username?CU:u);$("cm-bg")?.remove();render()}

      <input id="adm-lt" value="${SETTINGS.logo||"VOID"}" placeholder="Logo text..." style="margin-bottom:7px"/>
      <label class="lbl" style="cursor:pointer;margin-bottom:5px">🖼️ Background Image (from files)<input type="file" accept="image/*" style="display:none" onchange="admBg(this)"/></label>
      <input type="color" id="adm-bc" value="${SETTINGS.bgColor||"#08000f"}" style="width:46px;height:30px;border-radius:5px;border:1px solid var(--bdr);cursor:pointer;margin-bottom:7px"/>
      <label class="lbl" style="cursor:pointer;margin-bottom:5px">🎵 Music (from files)<input type="file" accept="audio/*" multiple style="display:none" onchange="addMusic(this)"/></label>
      <button class="btn bsm" style="width:100%" onclick="saveAdmSettings()">💾 SAVE</button>
    </div>
  </div>
  <div class="g2" style="margin-bottom:13px">
    <div class="panel">
      <div class="ptitle" style="font-size:13px">👥 All Users (${USERS.length})</div>
      <div style="max-height:300px;overflow-y:auto">${USERS.map(u=>{const ib=BANNED.includes(u.username.toLowerCase());return`<div style="display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid rgba(124,58,237,.08)"><div style="width:24px;height:24px;border-radius:50%;overflow:hidden;background:var(--mid);display:flex;align-items:center;justify-content:center;flex-shrink:0">${pfpH(u,24)}</div><div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--lt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.username}${ib?" 🚫":""}</div><div style="font-size:10px;color:var(--mut)">${fB(u.exp||0)} EXP | ${fB(u.coins||0)} VC</div></div><div style="display:flex;gap:3px;flex-shrink:0">${ib?`<button class="btn bsuc bsm" style="font-size:9px;padding:2px 6px" onclick="admUnban('${u.username}')">Unban</button>`:`<button class="btn br2 bsm" style="font-size:9px;padding:2px 6px" onclick="admBan('${u.username}')">Ban</button>`}<button class="btn bg bsm" style="font-size:9px;padding:2px 5px" onclick="admEXP('${u.username}')">+EXP</button><button class="btn bg bsm" style="font-size:9px;padding:2px 5px" onclick="admVC('${u.username}')">+VC</button></div></div>`}).join("")}</div>
    </div>
    <div class="panel">
      <div class="ptitle" style="font-size:13px">🏅 Custom Ranks</div>
      <input id="cr-n" placeholder="Rank name..." style="margin-bottom:5px"/>
      <input id="cr-h" placeholder="How to get..." style="margin-bottom:5px"/>
      <div style="display:flex;gap:7px;margin-bottom:7px;align-items:center"><input type="color" id="cr-c" value="#c084fc" style="width:38px;height:30px;border-radius:5px;border:1px solid var(--bdr);cursor:pointer"/><button class="btn bsm" onclick="admAddRank()">+ CREATE</button></div>
      <div style="max-height:180px;overflow-y:auto">${CRANKS.map(r=>`<div style="display:flex;align-items:center;gap:5px;padding:5px 0;border-bottom:1px solid rgba(124,58,237,.08)"><div style="width:7px;height:7px;border-radius:50%;background:${r.color};flex-shrink:0"></div><div style="flex:1;min-width:0"><div style="font-size:11px;color:${r.color};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.name}</div><div style="font-size:9px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.howToGet}</div></div><button onclick="admGiveRank(${r.id})" style="background:none;border:none;cursor:pointer;color:var(--lt);font-size:13px">🎁</button><button onclick="admDelRank(${r.id})" style="background:none;border:none;cursor:pointer;color:#f87171;font-size:13px">🗑</button></div>`).join("")}${CRANKS.length===0?`<div style="font-size:11px;color:var(--mut)">No custom ranks.</div>`:""}</div>
    </div>
  </div>
  <div class="panel">
    <div class="ptitle" style="font-size:13px">🏆 All 400 Void Ranks</div>
    <input placeholder="Search ranks..." oninput="filterRanks(this.value)" style="margin-bottom:9px"/>
    <div style="max-height:300px;overflow-y:auto" id="ranks-list">${RANKS.slice(0,100).map(r=>`<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(124,58,237,.08)"><span style="font-size:10px;color:var(--mut);width:28px">#${r.id}</span><div style="width:7px;height:7px;border-radius:50%;background:${r.color};flex-shrink:0"></div><div style="flex:1;min-width:0"><div style="font-size:11px;color:${r.color};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.name}</div><div style="font-size:9px;color:var(--mut)">${r.howToGet}</div></div><button onclick="admGiveRankById(${r.id})" style="background:none;border:none;cursor:pointer;color:var(--lt);font-size:12px">🎁</button></div>`).join("")}</div>
  </div>`}

function tryAdmin(){const pw=$("adm-pw")?.value||"",err=$("adm-err");if(pw===ADMIN_PW){ADMIN_ON=true;render()}else{if(err)err.textContent="Invalid void key."}}
function admBan(u){if(!BANNED.includes(u.toLowerCase()))BANNED.push(u.toLowerCase());LS.s("void_banned",BANNED);render()}
function admUnban(u){BANNED=BANNED.filter(x=>x!==u.toLowerCase());LS.s("void_banned",BANNED);render()}
function admEXP(un){const amt=parseInt(prompt(`Give EXP to ${un}?`)||0);if(!amt||amt<0)return;const u=USERS.find(x=>x.username===un);if(!u)return;u.exp=Math.min(1e20,(u.exp||0)+amt);USERS=USERS.map(x=>x.username===un?u:x);addVM(un,`⭐ Admin granted you ${fB(amt)} EXP!`);save();render()}
function admVC(un){const amt=parseInt(prompt(`Give VC to ${un}?`)||0);if(!amt||amt<0)return;const u=USERS.find(x=>x.username===un);if(!u)return;u.coins=Math.min(MAX_VC,(u.coins||0)+amt);USERS=USERS.map(x=>x.username===un?u:x);addVM(un,`💰 Admin granted you ${fB(amt)} Void Coins!`);save();render()}
function admBcMedia(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{AB_M=e.target.result;AB_MT=f.type;const p=$("bc-mprev");if(p){if(f.type.startsWith("image"))p.innerHTML=`<img src="${e.target.result}" style="max-width:100px;border-radius:5px;margin-bottom:5px"/>`;else p.innerHTML=`<div style="font-size:11px;color:#4ade80;margin-bottom:5px">📎 ${f.name} attached</div>`}};r.readAsDataURL(f)}
function doBroadcast(){const msg=($("bc-msg")?.value||"").trim();if(!msg&&!AB_M)return;const bc={message:msg,mediaUrl:AB_M||null,mediaType:AB_MT||null,seen:false,time:Date.now()};BCS.push(bc);LS.s("void_bcs",BCS);const bar=$("bcbar"),content=$("bcc"),med=$("bcmd");if(bar&&content){content.textContent=msg||(AB_M?"[Media broadcast]":"");if(med&&AB_M&&AB_MT?.startsWith("image"))med.innerHTML=`<img src="${AB_M}" style="height:30px;border-radius:4px;margin-left:7px"/>`;else if(med)med.innerHTML="";bar.classList.add("on");setTimeout(()=>bar.classList.remove("on"),9000)}AB_M=null;AB_MT=null;const ta=$("bc-msg");if(ta)ta.value="";alert("Broadcast sent!")}
function admLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{SETTINGS.logoImg=e.target.result;const li=$("logo-img");if(li)li.src=e.target.result};r.readAsDataURL(f)}
function admBg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{SETTINGS.bgImg=e.target.result;document.body.style.backgroundImage=`url(${JSON.stringify(e.target.result)})`};r.readAsDataURL(f)}
function saveAdmSettings(){SETTINGS.logo=$("adm-lt")?.value||SETTINGS.logo;SETTINGS.bgColor=$("adm-bc")?.value||SETTINGS.bgColor;const lt=$("logo-txt");if(lt)lt.textContent=SETTINGS.logo;document.body.style.backgroundColor=SETTINGS.bgColor;save();alert("Settings saved!")}
function admAddRank(){const name=($("cr-n")?.value||"").trim(),how=($("cr-h")?.value||"").trim(),col=$("cr-c")?.value||"#c084fc";if(!name)return;CRANKS.push({id:Date.now(),name,howToGet:how,color:col});LS.s("void_cranks",CRANKS);render()}
function admGiveRank(id){const r=CRANKS.find(x=>x.id===id);if(!r)return;const un=prompt(`Give rank "${r.name}" to?`);if(!un)return;const u=USERS.find(x=>x.username===un);if(!u){alert("User not found");return}u.specialRank=r.name;USERS=USERS.map(x=>x.username===un?u:x);addVM(un,`🏅 Admin gave you rank: ${r.name}`);save();alert(`Rank given to ${un}`)}
function admGiveRankById(id){const r=RANKS.find(x=>x.id===id);if(!r)return;const un=prompt(`Give rank "${r.name}" to?`);if(!un)return;const u=USERS.find(x=>x.username===un);if(!u){alert("User not found");return}u.specialRank=r.name;USERS=USERS.map(x=>x.username===un?u:x);addVM(un,`🏅 Admin promoted you to: ${r.name}`);save();alert(`Rank given to ${un}`)}
function admDelRank(id){CRANKS=CRANKS.filter(x=>x.id!==id);LS.s("void_cranks",CRANKS);render()}
function filterRanks(q){document.querySelectorAll("#ranks-list > div").forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?"flex":"none"})}

// MUSIC PLAYER
const AUD=$("aud");
function addMusic(inp){Array.from(inp.files).forEach(f=>{MQ.push({name:f.name,url:URL.createObjectURL(f)})});if(MQ.length&&!AUD.src)loadTrack(MI)}
function loadTrack(idx){if(!MQ.length)return;MI=((idx%MQ.length)+MQ.length)%MQ.length;AUD.src=MQ[MI].url;AUD.play().catch(()=>{});const nm=$("mp-name");if(nm)nm.textContent=MQ[MI].name;const pb=$("mp-play");if(pb)pb.textContent="⏸"}
// Music player events registered in boot()
function seekAud(e){const b=e.currentTarget,p=e.offsetX/b.offsetWidth;if(AUD.duration)AUD.currentTime=p*AUD.duration}
function toggleMute(){MUTED=!MUTED;AUD.muted=MUTED;const vb=$("mp-vol");if(vb)vb.textContent=MUTED?"🔇":"🔊"}

// BOOT
function boot(){
  initStars();
  // Register music player events
  const mpPlay=$("mp-play");
  if(mpPlay)mpPlay.onclick=()=>{if(AUD.paused){AUD.play();mpPlay.textContent="⏸";}else{AUD.pause();mpPlay.textContent="▶️";}};
  const mpPrev=$("mp-prev");
  if(mpPrev)mpPrev.onclick=()=>loadTrack(MI-1);
  const mpNext=$("mp-next");
  if(mpNext)mpNext.onclick=()=>loadTrack(MI+1);
  AUD.addEventListener("ended",()=>loadTrack(MI+1));
  AUD.addEventListener("timeupdate",()=>{if(!AUD.duration)return;const p=(AUD.currentTime/AUD.duration)*100;const pi=$("mp-prog");if(pi)pi.style.width=p+"%";});
  applySettings();
  // Check broadcast
  const lastBc=BCS[BCS.length-1];
  if(lastBc&&!lastBc.seen){const bar=$("bcbar"),content=$("bcc");if(bar&&content){content.textContent=lastBc.message||"[Media]";bar.classList.add("on");BCS[BCS.length-1].seen=true;LS.s("void_bcs",BCS);setTimeout(()=>bar.classList.remove("on"),8000)}}
  // Restore session
  const saved=sessionStorage.getItem("void_cu");
  if(saved){try{const u=JSON.parse(saved),fresh=USERS.find(x=>x.username===u.username);if(fresh&&!BANNED.includes(fresh.username.toLowerCase())){CU=fresh;SESSIONS=LS.g("void_sessions",[]);initMain();return}}catch{}}
  showAuth();
}
window.addEventListener("load",boot);



</script>
</body>
</html>
